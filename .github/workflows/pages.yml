name: Web practice build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh published download count
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-download-stats.cjs
      - run: npm run web:build
      - uses: actions/upload-artifact@v4
        with:
          name: IYK-DeckLab-Web
          path: dist/web
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Explain Pages setup when deployment fails
        if: failure()
        run: |
          echo 'GitHub Pages must be enabled in Settings → Pages, with Source set to GitHub Actions. Then rerun this workflow. The web build is available as the IYK-DeckLab-Web artifact.' >> "$GITHUB_STEP_SUMMARY"

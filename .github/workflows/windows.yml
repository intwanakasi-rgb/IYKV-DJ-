name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh published download count
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-download-stats.cjs
      - run: npm run package:win
      - name: Label development build and create checksum
        shell: pwsh
        run: |
          $installer = 'dist/desktop/IYK-DeckLab-Windows-Installer.exe'
          $hash = Get-FileHash -LiteralPath $installer -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  IYK-DeckLab-Windows-Installer.exe" | Set-Content -Encoding ascii 'dist/desktop/SHA256SUMS.txt'
          @'
          ## Unsigned development installer
          This is a development artifact, not a signed public release. Windows may show an Unknown publisher / SmartScreen warning. A checksum is included for integrity checking; it does not establish publisher identity.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: IYK-DeckLab-Windows
          path: |
            dist/desktop/*.exe
            dist/desktop/*.nsis.7z
            dist/desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14


  publish-download:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IYK-DeckLab-Windows
          path: installer
      - name: Publish direct Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Free IYK DeckLab Windows x64 development build.

          Download IYK-DeckLab-Windows-Installer.exe below. SHA256SUMS.txt is included for integrity checking.

          This installer is unsigned. Windows may show an Unknown publisher or SmartScreen warning. It is not a verified signed release.
          NOTES
          gh release create "windows-build-${BUILD_NUMBER}" installer/* --target "$BUILD_SHA" --title "IYK DeckLab Windows build ${BUILD_NUMBER} (unsigned)" --notes-file release-notes.md --latest

name: Publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require signing credentials
        run: node scripts/windows-signing.cjs --check
      - run: npm ci
      - name: Refresh published download count
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-download-stats.cjs
      - run: npm run package:win:signed
      - name: Verify trusted signatures and create installer checksum
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1
      - name: Publish installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?$') { throw "Use a version tag such as v0.1.0." }
          $assets = @(Get-ChildItem dist/desktop -File | Where-Object { $_.Name -eq "IYK-DeckLab-Windows-Installer.exe" -or $_.Name -like "*.nsis.7z" -or $_.Name -eq "SHA256SUMS.txt" } | ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { $_ -like "*IYK-DeckLab-Windows-Installer.exe" })) { throw "No Windows installer was produced." }
          gh release create "$env:RELEASE_TAG" $assets --target "$env:GITHUB_SHA" --title "IYK DeckLab $env:RELEASE_TAG" --generate-notes

